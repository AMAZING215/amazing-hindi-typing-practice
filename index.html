<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steno Practice</title>
<style>
body{margin:0;background:#f3f5fa;font-family:Arial;color:#172033}header{background:#172554;color:#fff;text-align:center;padding:20px}main{max-width:950px;margin:20px auto;padding:12px}.tabs{display:flex;gap:10px}.tabs button,button{padding:12px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.tabs button{flex:1;background:#fff}.tabs .active,button.primary{background:#172554;color:#fff}.card{background:#fff;padding:18px;margin:15px 0;border-radius:14px;box-shadow:0 2px 10px #0001}.row{display:flex;gap:12px}.row>*{flex:1}select,input,textarea{width:100%;padding:11px;border:1px solid #ccd2df;border-radius:8px;font-size:16px}#passage{padding:16px;background:#fafbff;border-radius:9px;font-size:21px;line-height:1.8;white-space:pre-wrap;min-height:130px}.kruti{font-family:"Kruti Dev 010","Kruti Dev","KrutiDev",Arial}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#f3f5fa;padding:10px;border-radius:9px}.stat b{display:block;font-size:22px}#typing{min-height:180px;resize:vertical;font-size:20px}.hidden{display:none}@media(max-width:650px){.row,.tabs{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>⌨️ Steno Typing Practice</h1><div>Hindi / Kruti Dev + English</div></header>
<main>
<div class="tabs"><button id="ht" class="active" onclick="setLang('hindi')">🇮🇳 Hindi / Kruti Dev</button><button id="et" onclick="setLang('english')">🇬🇧 English</button></div>
<div class="card"><div class="row"><div><b>Passage चुनें</b><select id="sel"></select></div><div><b>समय (मिनट)</b><input id="mins" type="number" min="1" value="5"></div></div><br><button class="primary" onclick="start()">▶ Start Test</button> <button onclick="reset()">↻ Reset</button></div>
<div class="card"><div class="stats"><div class="stat">समय<b id="timer">00:00</b></div><div class="stat">Words<b id="words">0</b></div><div class="stat">Speed<b id="speed">0</b> WPM</div><div class="stat">Accuracy<b id="acc">100%</b></div></div></div>
<div class="card"><h3>📖 Passage</h3><div id="passage"></div></div>
<div class="card"><h3>⌨️ यहाँ Type करें</h3><textarea id="typing" disabled placeholder="Start Test दबाएँ..."></textarea><br><br><button class="primary" onclick="finish()">⏹ Finish Test</button></div>
<div id="resultCard" class="card hidden"><h2>📊 Result</h2><div id="result"></div></div>
</main>
<script>
/* ===== नए PASSAGE इसी जगह जोड़ें ===== */
const PASSAGES={
hindi:[
{title:"Hindi Passage 1",text:";kjk;s.k] iz'kklu dh O;oLFkk esa vuq'kklu] le;ikyu vkSj drZO;fu"Bk dk fo'ks"k egRo gSA ,d deZpkjh dks vius dk;Z dks iwjh ftEesnkjh vkSj bZekunkjh ls djuk pkfg,A dk;kZy; esa izR;sd dk;Z dks fu/kkZfjr le; esa iwjk djuk vko';d gSA"},
{title:"Hindi Passage 2",text:";g lekt ds izR;sd O;fDr dk drZO; gS fd og dkuwu vkSj fu;eksa dk ikyu djsA U;k; O;oLFkk esa lR;] fu"i{krk vkSj ikjnf'kZrk dk egRo cgqr vf/kd gSA"}
],
english:[
{title:"English Passage 1",text:"Discipline and regular practice are the foundation of success. A candidate should work with patience, accuracy and confidence. Regular typing practice improves speed and reduces mistakes."},
{title:"English Passage 2",text:"Good preparation requires a clear plan and daily practice. A student should revise important topics, take regular tests and carefully analyse mistakes."}
]};
let lang="hindi",timer=null,left=0,startTime=0,running=false;
const $=x=>document.getElementById(x);
function setLang(x){lang=x;$("ht").classList.toggle("active",x==="hindi");$("et").classList.toggle("active",x==="english");load();reset()}
function count(t){return t.trim()?t.trim().split(/\s+/).length:0}
function load(){let s=$("sel");s.innerHTML="";PASSAGES[lang].forEach((p,i)=>{let o=document.createElement("option");o.value=i;o.textContent=p.title;s.appendChild(o)});show()}
function show(){let p=PASSAGES[lang][+$("sel").value||0];$("passage").textContent=p.text;$("passage").className=lang==="hindi"?"kruti":"";$("words").textContent=count(p.text)}
$("sel").onchange=()=>{show();reset()}
function start(){clearInterval(timer);left=(+$("mins").value||5)*60;running=true;startTime=Date.now();$("typing").disabled=false;$("typing").value="";$("typing").focus();tick();timer=setInterval(()=>{left--;tick();if(left<=0)finish()},1000)}
function tick(){$("timer").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}
function finish(){if(!running&&!$("typing").value.trim())return;clearInterval(timer);running=false;$("typing").disabled=true;let src=$("passage").textContent.trim().split(/\s+/),typed=$("typing").value.trim()?$("typing").value.trim().split(/\s+/):[],bad=0;typed.forEach((w,i)=>{if(w!==src[i])bad++});let miss=Math.max(0,src.length-typed.length),correct=Math.max(0,typed.length-bad),sec=Math.max(1,(Date.now()-startTime)/1000),sp=typed.length/(sec/60),a=typed.length?correct/typed.length*100:100;$("speed").textContent=Math.round(sp);$("acc").textContent=a.toFixed(1)+"%";$("result").innerHTML="<b>Total Words:</b> "+src.length+"<br><b>Typed Words:</b> "+typed.length+"<br><b>Missed Words:</b> "+miss+"<br><b>Incorrect Words:</b> "+bad+"<br><b>Accuracy:</b> "+a.toFixed(1)+"%<br><b>Gross Speed:</b> "+Math.round(sp)+" WPM";$("resultCard").classList.remove("hidden")}
function reset(){clearInterval(timer);running=false;$("typing").disabled=true;$("typing").value="";$("timer").textContent="00:00";$("speed").textContent="0";$("acc").textContent="100%";$("resultCard").classList.add("hidden");show()}
load();
</script>
</body>
</html>
