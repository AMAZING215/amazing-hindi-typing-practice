<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554"><title>AMAZING HINDI TYPING PRACTICE</title>
<style krutidev010
>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif}
header{background:linear-gradient(135deg,#172554,#4338ca);color:white;padding:24px 16px 34px;border-radius:0 0 28px 28px}
main{max-width:850px;margin:-18px auto 30px;padding:0 12px}.brand{font-size:23px;font-weight:900}.sub{opacity:.85;margin-top:5px}
.card{background:white;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 6px 22px #00000010}
select,button,textarea,input{font:inherit}select,input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:12px;background:white}
button{padding:12px 17px;border:0;border-radius:12px;background:#4338ca;color:white;font-weight:800}button.alt{background:#eef2ff;color:#312e81}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button{grid-column:1/-1}
.timer{text-align:center;font-size:42px;font-weight:900;margin:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center;background:#f8fafc;border-radius:13px;padding:10px}.n{font-size:23px;font-weight:900}.l{font-size:11px;color:#64748b}
.passage{font-size:20px;line-height:2;background:#f8fafc;padding:14px;border-radius:14px;max-height:300px;overflow:auto}
textarea{width:100%;min-height:210px;border:2px solid #dbe2ea;border-radius:14px;padding:14px;font-size:20px;line-height:1.8;outline:0}
textarea:focus{border-color:#4338ca}.actions{display:flex;gap:8px;flex-wrap:wrap}.result{display:none}.score{font-size:34px;font-weight:900;color:#4338ca}
@media(max-width:600px){.brand{font-size:19px}.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.controls button{grid-column:auto}.passage{font-size:18px}textarea{font-size:18px}}
</style></head>
<body>
<header><div class="brand">🚀 AMAZING HINDI TYPING PRACTICE</div><div class="sub">Hindi Typing • Kruti Dev • Speed • Accuracy</div></header>
<main>
<div class="card">
<div class="controls">
<select id="passage"><option value="0">Passage 01 — प्रशासनिक व्यवस्था</option><option value="1">Passage 02 — न्यायालय एवं कार्यालय</option><option value="2">Passage 03 — नियमित अभ्यास</option></select>
<select id="time"><option value="1">1 मिनट Demo</option><option value="5" selected>5 मिनट Test</option><option value="10">10 मिनट Test</option><option value="15">15 मिनट Test</option></select>
<button id="start">▶ START TEST</button></div>
<div class="timer" id="timer">05:00</div>
<div class="grid">
<div class="stat"><div class="n" id="wpm">0</div><div class="l">WPM</div></div>
<div class="stat"><div class="n" id="acc">100%</div><div class="l">ACCURACY</div></div>
<div class="stat"><div class="n" id="err">0</div><div class="l">INCORRECT</div></div>
<div class="stat"><div class="n" id="miss">0</div><div class="l">MISSED</div></div>
</div></div>
<div class="card"><h3>📖 Passage</h3><div class="passage" id="text"></div></div>
<div class="card"><h3>⌨️ Type Here</h3><textarea id="input" disabled placeholder="START TEST दबाएँ और यहाँ typing करें..."></textarea><div class="actions" style="margin-top:10px"><button class="alt" id="clear">CLEAR</button><button class="alt" id="finish">FINISH TEST</button></div></div>
<div class="card result" id="result"><h2>🏆 TEST RESULT</h2><div class="score" id="score"></div><p id="details"></p><div id="wrong"></div></div>
</main>
<script>
const passages=[
"रlquks vki 6 fnlEcj 2024 dks Hktu yky ljdkj }kjk jkLrk [kksyks vfHk;ku pyk;k x;k Fkk mlesa gekjk jkLrk Hkh [kksyk x;k Fkk mlesa iVokjh vkSj iqfyl iz'kklu }kjk jkLrk [kksyk x;k Fkk vkSj ml le; foi{k ikVhZ ds dksbZ Hkh lnL; ogka ekStwn ugha Fkk rks iVjokjh us [kqn mudh rjQ ykBh jksih Fkh vkSj gesa cksyk x;k fd vki rks bu ykfB;ksa ls uki djds viuh vksj iRFkj x<+h dj ys rc geus cksyk fd ;s dke ge ugha dj ldrs rks mUgksusa ;g dgk fd vki rks dj yks ;g tks dk;Zokgh dh tk jgh gS og iqfyl iz'kku o brus yksxksa ds e/; gks jgh gS ;s vkkidk dqN ugha djsaxs ysfdu dqN le; ckn iVokjh ogka ls pys x;s vkSj muds lkFk iqfyl iz'kklu Hkh ogka ls pyk x;k rks ge mu ykfB;ksa ls uki ysdj gekjh vksj iRFkj x<+h dj jgs Fks rks FkksM+h nsj ckn foi{kh ikVhZ ds yksx vk;s vkSj iVokjh ds }kjk jksih xbZ lHkh ykfB;ksa dks m[kkM+ QSad fn;k muds ykfB;ks dks m[kkM+ QSad nsus ds ckn gekjs ikl mldh lgh uki ugha jgh vkSj geus iRFkj x<+h dks ogha jksd fn;k vkSj tks geus dqN iRFkj x<+h dh Fkh mudks Hkh ,d&nks fnu ckn jkr ds le; esa m[kkM+ QSad fn;k Fkk vc eSa blesa iw.kZ fo'okl ds lkFk ;g ugha dgrk fd mu iRFkjksa dks mUgksaus ;ku foi{kh ikVhZ ds yksxksa us gh fudky QSads Fks ;s rks eSa esjs vuqeku ls cksy jgk gwa fQj geus mldk fojks/k Hkh ugha fd;k fojks/k blfy, ugha fd;k D;ksafd ges ;g yxrk jgk fd ;g dk;Zokgh fQj ls pkyw gksxh vFkkZr ljdkj }kjk iqu% ;g dkjZokbZ dh tk;sxh rc jkLrk Lor% pkyw gks tk;sxkA fQj dqN fnuksa ckn ;kuh 1 lky ckn eSjh nknh th dk LoxZokl gks x;k Fkk rks mu fnuksa es mUgksaus ;kuh foi{kh i{k ds yksxksa us viuh vksj iRFkj x<+h djuh pkyw dj nh vc ml le; oks tks dj jgs Fks ge mudks jksd ugha lds D;ksafd ge gekjs nknh ds fnuksa esa O;oLFk Fks D;ksafd nknh ds LoxZokl dks vHkh 12 fnu Hkh iw.kZ ugh gq, FksA rks mu yksxksa us bldk Qk;nk mBk;k vkSj iRFkj x<+h dj yh tc geus iqfyl dks cksyk rks iqfyl us cksyk dh jkLrk pkyw gSA vkSj ogka ls pys x;s fQj ;s ekeyk pkyw gqvk rks geus vkilh lgerh ls ml jkLrs dks pkyw dj fy;k ysfdu dqN le; ckn fQj ls oks cksys fd ;g jkLrk xyr txg gSA vHkh gekjh tehu vkSj gS jkLrs esa tcfd igys Hkh jkLrk xyr txg gh fudkyk x;k Fkk ;kuh vkilh lgefr ls Hkh oks xyr txg Fkk ysfdu oks xyr txg mudh vkSj ugha gekjh vkSj Fkh vxj vki dks xyr yxs rks vki bl jkLrs dks 6 fnlacj 2024 okys vfHk;ku ds tfj, uki djok, vkSj [kkSys vkSj blls Hkh irk uk pys rks bl jkLrs dh uki dks 2015 ds uki ds vuqlkj pkyw djok;k tk;sA eSa pkgrk gw dh bldh fuli{k tkap gks vksj lgh jkLrk fudys uqDlku fdlh dk uk gksA ges jkLrk lgh fn;k tk;s vkSj bldks iDdk djok;k tk;sA const $=x=>document.getElementById(x);let target="",running=false,left=300,total=300,startAt=0,clock;
function ws(s){return s.trim()?s.trim().split(/\s+/):[]}function fmt(x){return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function load(){target=passages[+$("passage").value];$("text").textContent=target;left=+$("time").value*60;total=left;$("timer").textContent=fmt(left)}load();
$("passage").onchange=()=>{if(!running)load()};$("time").onchange=()=>{if(!running)load()};
function analyze(){let a=ws($("input").value),b=ws(target),bad=0;a.forEach((x,i)=>{if(x!==b[i])bad++});let miss=Math.max(0,b.length-a.length),acc=a.length?Math.max(0,(a.length-bad)/a.length*100):100,mins=Math.max(.01,(Date.now()-startAt)/60000);$("wpm").textContent=Math.round(a.length/mins);$("acc").textContent=acc.toFixed(1)+"%";$("err").textContent=bad;$("miss").textContent=miss;return{a,b,bad,miss,acc,wpm:a.length/mins}}
function start(){clearInterval(clock);running=true;left=total=+$("time").value*60;startAt=Date.now();$("timer").textContent=fmt(left);$("input").disabled=false;$("input").value="";$("result").style.display="none";$("input").focus();clock=setInterval(()=>{left--; $("timer").textContent=fmt(left);analyze();if(left<=0)finish()},1000)}
function finish(){if(!running)return;running=false;clearInterval(clock);$("input").disabled=true;let r=analyze(),marks=Math.min(100,r.acc);$("score").textContent=marks.toFixed(1)+" / 100";$("details").innerHTML=`Total Words: <b>${r.b.length}</b><br>Typed Words: <b>${r.a.length}</b><br>Missed Words: <b>${r.miss}</b><br>Incorrect Words: <b>${r.bad}</b><br>Speed: <b>${r.wpm.toFixed(1)} WPM</b><br>Accuracy: <b>${r.acc.toFixed(1)}%</b>`;let e=[];r.a.forEach((x,i)=>{if(x!==r.b[i])e.push((i+1)+". "+x+" → "+(r.b[i]||"—"))});$("wrong").innerHTML=e.length?"<p><b>❌ गलतियाँ</b></p>"+e.slice(0,50).join("<br>"):"<p>✅ बहुत बढ़िया! कोई incorrect word नहीं।</p>";$("result").style.display="block";$("result").scrollIntoView({behavior:"smooth"})}
$("start").onclick=start;$("finish").onclick=finish;$("clear").onclick=()=>{$("input").value="";if(running)analyze()};
</script></body></html>
